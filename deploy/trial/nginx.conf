server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;

    location = /admin-api/rd/document-ocr/recognize {
        client_max_body_size 11m;
        client_body_timeout 10s;
        access_log off;
        proxy_request_buffering on;
        proxy_pass http://backend:48080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 75s;
    }

    location /admin-api/ {
        proxy_pass http://backend:48080/admin-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Public resources belong to the configured deployment, never a client-selected tenant.
    location ^~ /admin-api/rd/package-link {
        access_log off;
        if ($args !~ "^((resource|workMode|internal)=[A-Za-z0-9_-]*(&(resource|workMode|internal)=[A-Za-z0-9_-]*)*)?$") { return 400; }
        proxy_pass http://backend:48080;
        proxy_http_version 1.1;
        proxy_set_header tenant-id ${RD_PUBLIC_TENANT_ID};
        proxy_set_header visit-tenant-id "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Rd-Web-Transport "nginx";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location ~ "^/(?:[A-Za-z0-9_-]+/)*pkg/([A-Za-z0-9][A-Za-z0-9_-]{0,63})$" {
        set $package_code $1;
        access_log off;
        if ($args !~ "^((resource|workMode|internal)=[A-Za-z0-9_-]*(&(resource|workMode|internal)=[A-Za-z0-9_-]*)*)?$") { return 400; }
        rewrite ^ /admin-api/rd/package-link/$package_code/resolve break;
        proxy_pass http://backend:48080;
        proxy_http_version 1.1;
        proxy_set_header tenant-id ${RD_PUBLIC_TENANT_ID};
        proxy_set_header visit-tenant-id "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Rd-Web-Transport "nginx";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location = /_rd-package-web {
        internal;
        add_header Cache-Control no-store;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
