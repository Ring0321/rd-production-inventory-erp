name: rd-erp-local

services:
  mysql:
    image: mysql:8.4
    container_name: rd-erp-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: rd_erp
      MYSQL_ROOT_PASSWORD: ${RD_DB_PASSWORD:?set RD_DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - rd-erp-mysql-data:/var/lib/mysql
      - ../../backend/sql/mysql/rd_erp_clean.sql:/docker-entrypoint-initdb.d/01-rd-erp-clean.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: rd-erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - rd-erp-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  rd-erp-mysql-data:
  rd-erp-redis-data:
